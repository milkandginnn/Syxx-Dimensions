# PROVENANCE: DERIVED-FROM-DOCUMENTATION
# NOT captured from a real host. Authored on macOS.
#
# Shape source: resolv.conf(5) syntax
#   https://man7.org/linux/man-pages/man5/resolv.conf.5.html
# Represents a machine running its own recursive resolver or filtering forwarder on
# loopback — unbound, dnsmasq, stubby or pi-hole — which is the documented configuration
# for each of those on a single host.
#
# WHAT THIS PINS — why loopback exclusion must NOT be blanket. 127.0.0.1 here is not the
# systemd stub; it is a resolver the user deliberately runs, and it IS the server
# answering their queries. Dropping every loopback address would blind the comparison and
# leak probes on exactly the machines whose owners took the most care. Only the
# systemd-resolved stub listeners (127.0.0.53 / 127.0.0.54) are excluded, and they are
# excluded loudly rather than silently.
#
# EncryptedDNSStatusCore already reports a loopback resolver as Unknown ("upstream
# transport not verifiable from the client"), which is the honest treatment: the local
# proxy's own hop is trivially secure and says nothing about what it does upstream.
nameserver 127.0.0.1
options edns0
