<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05B5D4"></stop>
      <stop offset="55%" stop-color="#0066CC"></stop>
      <stop offset="100%" stop-color="#8C5CF5"></stop>
    </linearGradient>
    <linearGradient id="ring" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#05B5D4"></stop>
      <stop offset="60%" stop-color="#4A8BE0"></stop>
      <stop offset="100%" stop-color="#8C5CF5"></stop>
    </linearGradient>
    <radialGradient id="tile" cx="50%" cy="32%" r="90%">
      <stop offset="0%" stop-color="#16223C"></stop>
      <stop offset="60%" stop-color="#0E1730"></stop>
      <stop offset="100%" stop-color="#0A0F1E"></stop>
    </radialGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC24D"></stop>
      <stop offset="100%" stop-color="#F59E0A"></stop>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"></feGaussianBlur>
      <feComponentTransfer in="b" result="bf"><feFuncA type="linear" slope="0.55"></feFuncA></feComponentTransfer>
      <feMerge>
        <feMergeNode in="bf"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"></feGaussianBlur>
      <feComponentTransfer in="b" result="bf"><feFuncA type="linear" slope="0.5"></feFuncA></feComponentTransfer>
      <feMerge>
        <feMergeNode in="bf"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#tile)"></rect>
  <rect x="32.5" y="32.5" width="959" height="959" rx="223.5" fill="none" stroke="#2A3A5E" stroke-opacity="0.55" stroke-width="1.5"></rect>

  
  <circle cx="512" cy="512" r="320" fill="#05B5D4" opacity="0.03"></circle>
  <circle cx="512" cy="512" r="240" fill="#8C5CF5" opacity="0.04"></circle>

  
  <circle cx="512" cy="512" r="278" fill="none" stroke="#4A8BE0" stroke-opacity="0.42" stroke-width="4.5"></circle>
  <circle cx="512" cy="512" r="292" fill="none" stroke="url(#ring)" stroke-opacity="0.72" stroke-width="28" stroke-dasharray="5 43.66" stroke-linecap="butt" transform="rotate(-8 512 512)"></circle>

  
  <g filter="url(#glow)">
    <path d="M 743.9 258.1&#xA;             A 345 345 0 1 0 800.5 330.2" fill="none" stroke="url(#ring)" stroke-width="52" stroke-linecap="round"></path>
  </g>

  
  <g filter="url(#softGlow)">
    <circle cx="167" cy="512" r="15" fill="#05B5D4"></circle>
    <circle cx="512" cy="857" r="12" fill="#8C5CF5"></circle>
    <circle cx="242" cy="757" r="9" fill="#0D9487"></circle>
  </g>
  <circle cx="167" cy="512" r="5.5" fill="#0E1730"></circle>
  <circle cx="512" cy="857" r="4.5" fill="#0E1730"></circle>

  
  <g filter="url(#glow)">
    <path d="M 368 372 H 652 L 368 652 H 660" fill="none" stroke="url(#brand)" stroke-width="82" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>

  
  <g filter="url(#softGlow)" transform="translate(788,270) scale(1.06)">
    <path d="M 0 -78 L 20.5 -25.5 L 76 -22 L 33 13.5 L 47 68 L 0 38 L -47 68 L -33 13.5 L -76 -22 L -20.5 -25.5 Z" fill="url(#star)"></path>
  </g>
</svg>