<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand gradient: io-blue to io-electric -->
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05B5D4"/>
      <stop offset="55%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#8C5CF5"/>
    </linearGradient>
    <linearGradient id="brandBar" gradientUnits="userSpaceOnUse"
                    x1="282" y1="762" x2="686" y2="762">
      <stop offset="0%" stop-color="#05B5D4"/>
      <stop offset="55%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#8C5CF5"/>
    </linearGradient>
    <linearGradient id="dial" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#05B5D4"/>
      <stop offset="60%" stop-color="#4A8BE0"/>
      <stop offset="100%" stop-color="#8C5CF5"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC24D"/>
      <stop offset="100%" stop-color="#F59E0A"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feComponentTransfer in="b" result="bf"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode in="bf"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feComponentTransfer in="b" result="bf"><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode in="bf"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Instrument dial: hairline + tick marks -->
  <circle cx="512" cy="512" r="360" fill="none" stroke="#4A8BE0" stroke-opacity="0.42" stroke-width="4.5"/>
  <circle cx="512" cy="512" r="376" fill="none" stroke="url(#dial)" stroke-opacity="0.72"
          stroke-width="28" stroke-dasharray="5 60.66" stroke-linecap="butt"
          transform="rotate(-8 512 512)"/>

  <!-- N monogram -->
  <g filter="url(#glow)">
    <path d="M 352 661 V 297 L 672 661 V 297"
          fill="none" stroke="url(#brand)" stroke-width="82"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Baseline bar under the N -->
  <g filter="url(#glow)">
    <path d="M 282 762 H 686" fill="none" stroke="url(#brandBar)"
          stroke-width="36" stroke-linecap="round"/>
  </g>

  <!-- Amber star: lower-right -->
  <g filter="url(#softGlow)" transform="translate(718,752) scale(0.92) rotate(14)">
    <path d="M 0 -78 L 20.5 -25.5 L 76 -22 L 33 13.5 L 47 68 L 0 38 L -47 68 L -33 13.5 L -76 -22 L -20.5 -25.5 Z"
          fill="url(#amber)"/>
  </g>

</svg>
