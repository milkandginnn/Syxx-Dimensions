openapi: "3.0.3"
info:
  title: Syxx Server API
  version: "1.0.0"
  description: |
    DNS investigation and tampering detection API. Provides authenticated
    endpoints for DNS resolution, authoritative ground-truth lookups,
    leak detection, content diffing, and passive DNS history.

    ## Authentication
    Endpoints marked `paid` require a valid Syxx Pro license. Authenticate via:
    - `X-Syxx-API-Key: syxx_...` header (API key)
    - `Authorization: Bearer <session-token>` header (session token)
    - `X-Syxx-License: <license-key>` header (license key)

    Unauthenticated requests to paid endpoints return `402 Payment Required`.

    ## API Versioning
    All endpoints under `/api/` are also available at `/api/v1/` for version pinning.

    ## Pagination
    List endpoints support `?page=N&limit=M` query parameters. Response includes
    a `pagination` object with `page`, `limit`, `total`, and `hasMore`.

servers:
  - url: https://syxx.app
    description: Production server

tags:
  - name: Public
    description: Free-tier endpoints (rate-limited per IP)
  - name: Paid
    description: Pro-tier endpoints (entitlement required)
  - name: Auth
    description: Authentication and session management
  - name: Webhooks
    description: Stripe and Keygen webhook receivers

paths:
  # ── Public endpoints ──
  # 2026-08-11 /api/appcast GET — warp-hardening_20260811 added; Ed25519-signed appcast feed — route was missing from spec
  /api/appcast:
    get:
      tags: [Public]
      summary: Ed25519-signed auto-update appcast (Sparkle-inspired)
      description: >
        Returns the current release manifest for the requested platform, signed with
        the dedicated update key; clients verify the signature before installing
        anything. Refuses (404) when no complete published package exists for the
        platform or the signing key is unavailable.
      parameters:
        - name: platform
          in: query
          schema: { type: string, default: "mac", enum: ["mac", "win", "deb"] }
      responses:
        "200":
          description: Signed appcast manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  platform: { type: string }
                  version: { type: string }
                  build: { type: integer }
                  minVersion: { type: string }
                  critical: { type: boolean }
                  releaseNotes: { type: string }
                  publishedAt: { type: integer }
                  signature: { type: string, description: "Base64 Ed25519 signature over the canonical manifest" }
                  packages:
                    type: array
                    items:
                      type: object
                      properties:
                        url: { type: string, format: uri }
                        sha256: { type: string }
                        size: { type: integer }
                        type: { type: string }
        "404":
          description: No update available for this platform

  # 2026-08-11 /api/beta/reserve POST — warp-hardening_20260811 added; closed-beta interest form — route was missing from spec
  /api/beta/reserve:
    post:
      tags: [Public]
      summary: Record interest in the Nnyx/Zzyn closed betas
      description: >
        Public signup form, rate-limited per IP. Persists the reservation and
        best-effort sends a confirmation email on a background thread; the operator
        receives a weekly digest of all rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, interests]
              properties:
                email:
                  type: string
                  format: email
                interests:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: ["nnyx", "zzyn"]
      responses:
        "200":
          description: Reservation recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  interests:
                    type: array
                    items: { type: string }
                  confirmation: { type: boolean }
        "400":
          $ref: "#/components/responses/Error400"

  # 2026-08-11 /api/broadcast GET — warp-hardening_20260811 added; MOTD broadcast, unauthenticated (no security) — route was missing from spec
  /api/broadcast:
    get:
      tags: [Public]
      summary: Message-of-the-day broadcast
      description: >
        Returns the current operator-set broadcast (so a security message reaches
        every user, Lite or Pro) or null when none is active; the app shows an
        unseen id once.
      responses:
        "200":
          description: Current broadcast
          content:
            application/json:
              schema:
                type: object
                properties:
                  broadcast:
                    type: object
                    nullable: true

  # 2026-08-11 /api/startup GET — warp-hardening_20260811 added; consolidated startup check — route was missing from spec
  /api/startup:
    get:
      tags: [Public]
      summary: Consolidated startup check
      description: >
        ONE call so the app does not phone home per feature: current broadcast +
        update availability (vs. the client's version) + a What's New pointer.
        This is the privacy consolidation from the plan.
      parameters:
        - name: platform
          in: query
          schema: { type: string, default: "mac", enum: ["mac", "win", "deb"] }
        - name: version
          in: query
          schema: { type: string, description: "Client version for update comparison" }
      responses:
        "200":
          description: Broadcast, update availability, and What's-New pointer
          content:
            application/json:
              schema:
                type: object
                properties:
                  broadcast:
                    type: object
                    nullable: true
                  update:
                    type: object
                    nullable: true
                    properties:
                      available: { type: boolean }
                      latest: { type: string }
                      url: { type: string, format: uri }
                  whatsNewUrl: { type: string }

  # 2026-08-11 /api/whats-new GET — warp-hardening_20260811 added; per-platform What's-New HTML — route was missing from spec
  /api/whats-new:
    get:
      tags: [Public]
      summary: Per-platform What's-New HTML
      description: >
        Legacy `?platform=` route serving the self-contained per-platform What's-New
        HTML under a strict CSP; the content is Ed25519-signed via the
        X-Syxx-Signature header. The MOTD subdomains serve the same files at / via
        Host routing.
      parameters:
        - name: platform
          in: query
          schema: { type: string, default: "mac", enum: ["mac", "win", "deb"] }
      responses:
        "200":
          description: What's-New HTML (signed via X-Syxx-Signature)
          content:
            text/html: {}
        "404":
          description: No what's-new content

  # 2026-08-11 /api/stats GET — warp-hardening_20260811 pre-existing; verified against live dispatch — unchanged
  /api/stats:
    get:
      tags: [Public]
