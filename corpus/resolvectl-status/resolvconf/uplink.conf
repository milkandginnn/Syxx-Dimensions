# PROVENANCE: DERIVED-FROM-DOCUMENTATION
# NOT captured from a real host. Authored on macOS.
#
# Shape source: systemd-resolved(8), "uplink" resolv.conf mode — /run/systemd/resolve/resolv.conf,
# which lists the current uplink DNS servers directly rather than the stub:
#   https://www.freedesktop.org/software/systemd/man/latest/systemd-resolved.service.html
# resolv.conf directive syntax per resolv.conf(5):
#   https://man7.org/linux/man-pages/man5/resolv.conf.5.html
#
# WHAT THIS PINS: real (non-stub) nameservers must be used, and the transport must be
# recorded as Unknown — resolv.conf carries no transport information, so "not encrypted"
# would be a claim this file cannot support.
nameserver 192.168.1.1
nameserver 8.8.8.8
search lan
