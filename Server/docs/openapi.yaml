components:
  schemas:
    Stats:
      type: object
      properties:
        passiveRecords:
          type: integer

    DnsLookup:
      type: object
      properties:
        domain:
          type: string
        type:
          type: string
        server:
          type: string
        rcode:
          type: integer
        rcodeName:
          type: string
        ad:
          type: boolean
        records:
          type: array
          items:
            $ref: "#/components/schemas/DnsRecord"
        truncated:
          type: boolean

    DnsRecord:
      type: object
      properties:
        type:
          type: string
        value:
          type: string

    Session:
      type: object
      properties:
        session:
          type: string
        expiresAt:
          type: integer
        plan:
          type: string

    PublicKey:
      type: object
      properties:
        publicKey:
          type: string
          description: "Base64-encoded Ed25519 public key"
        keyId:
          type: string
          description: "Truncated key identifier"

    DiffRequest:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
        type:
          type: string
          enum: ["A", "AAAA"]
          default: "A"
        localAnswers:
          type: array
          items: { type: string }
          maxItems: 64
        url:
          type: string
          format: uri
        localHTML:
          type: string
          maxLength: 500000
        localScripts:
          type: array
          items: { type: string }
        localInlineScriptHashes:
          type: array
          items: { type: string }

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: string

  responses:
    Error400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error402:
      description: Payment required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error429:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error502:
      description: Upstream error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error503:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"