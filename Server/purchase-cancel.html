<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Syxx — Purchase Cancelled</title>
  <link rel="icon" type="image/png" href="assets/syxx-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Jost:ital,wght@0,300..700;1,300..500&family=Cormorant+SC:wght@400;600;700&family=EB+Garamond:ital,wght@0,400..600;1,400..600&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet">
  <style>
    :root {
      --io-bg: #0b0518;
      --io-surface: #170c2e;
      --io-text: #efeafe;
      --io-text-secondary: #c9c1e6;
      --io-blue: #7c5cff;
      --io-accent-start: #d9a441;
      --font-sans: 'Jost', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: radial-gradient(130% 80% at 15% 0%, #1a0c33 0%, #0b0518 55%);
      color: var(--io-text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      max-width: 480px; width: 90%; margin: 40px auto;
      padding: 48px 40px;
      background: var(--io-surface);
      border-radius: 20px;
      border: 1px solid rgba(217, 164, 65, 0.3);
      text-align: center;
    }
    h1 { font-family: 'Cinzel', Georgia, serif; font-size: 28px; font-weight: 700; margin: 0 0 8px 0; color: var(--io-text); }
    .subtitle { font-family: 'EB Garamond', Georgia, serif; color: var(--io-text-secondary); font-size: 17px; line-height: 1.5; margin-bottom: 28px; }
    .btn {
      display: inline-block; padding: 14px 32px; border-radius: 10px;
      font-family: var(--font-sans); font-weight: 600; font-size: 15px;
      color: #fff; background: var(--io-blue); text-decoration: none;
      transition: filter .2s;
    }
    .btn:hover { filter: brightness(1.1); }
    .footer { margin-top: 24px; font-size: 13px; color: rgba(201,193,230,0.4); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Purchase Cancelled</h1>
    <p class="subtitle">
      No charge was made. If you change your mind, you can start a Pro trial from inside Syxx at any time.
    </p>
    <a class="btn" href="https://syxx.app">Back to Syxx</a>
    <footer class="footer">Questions? Contact support at syxx.app/help</footer>
  </main>
</body>
</html>
