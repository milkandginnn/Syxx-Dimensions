# SwiftLint configuration for Syxx macOS sources.
# Enforces safety rules critical to the tri-state honesty protocol.

excluded:
  - macOS/.build
  - macOS/Tests
  - macOS/Sources/CTls

opt_in_rules:
  - force_unwrapping
  - force_cast
  - force_try
  - implicitly_unwrapped_optional
  - empty_count
  - first_where
  - last_where
  - operator_usage_whitespace
  - sorted_first_last
  - toggle_bool
  # CI-030: prevent mega-files that are hard to review and maintain.
  - file_length

disabled_rules:
  - trailing_whitespace
  - todo  # Deltas contain TODO markers by design

included:
  - macOS/Sources

# Rules tuned for the Syxx codebase
force_cast: error
force_try: error
force_unwrapping: error
implicitly_unwrapped_optional: warning
line_length:
  warning: 200
  error: 300
type_body_length:
  warning: 500
  error: 800
function_body_length:
  warning: 100
  error: 200
# CI-030: per-file line limit to prevent mega-files.
file_length:
  warning: 800
  error: 1500
  ignore_comment_only_lines: true
cyclomatic_complexity:
  warning: 20
  error: 35
