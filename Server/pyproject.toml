[project]
name = "syxx-server"
version = "1.0.0"
description = "Syxx DNS tampering detection — collector and API server"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=49.0.0",
    "brotli>=1.2.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "sentry-sdk[opentelemetry]>=2.67.0",
]

[tool.uv]
# uv is the canonical package manager for this project (see tech-stack.md).
# Run `uv lock` to generate/update uv.lock; `uv sync` to install.

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["venv", "__pycache__", ".build", "RECOVERED-fulfillment-A025-A085.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # use of assert (needed in tests)
    "S104",   # binding to all interfaces (server binds 0.0.0.0)
    "S108",   # hardcoded temp directory (test fixtures)
    "B008",   # function call in default argument (Flask-style)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S",     # security checks relaxed in tests
    "T20",   # print allowed in tests
]

[tool.bandit]
exclude_dirs = ["tests", "venv", "__pycache__"]
skips = ["B101"]  # assert_used — needed in tests

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ty]
# A022: ty does NOT honor inline "# type: ignore" — all suppression must be
# configured at the project level via overrides. Every override below exists
# because ty cannot model a runtime pattern (optional deps, None-guarded
# assignments, wildcard re-exports). Each block documents WHY it is needed.

# --- Optional dependency imports (cryptography, sentry_sdk, opentelemetry, brotli) ---
# These 7 files import optional libraries inside try/except ImportError guards.
# ty cannot resolve modules that may not be installed in the analysis environment.
# Removing cryptography or opentelemetry from the venv would make these real errors.
[[tool.ty.overrides]]
include = ["syxx_server/app.py", "syxx_server/appcast.py", "syxx_server/dnssec_validator.py", "syxx_server/leak.py", "syxx_server/licensing.py", "syxx_server/preflight.py", "syxx_server/warp.py"]
rules = { "unresolved-import" = "ignore" }

# --- app.py: OTel/Sentry objects initialized as None, assigned from optional imports ---
# unresolved-attribute: dnssec_validator may be None (conditional import); OTel objects
#   (TracerProvider, LoggerProvider) have attributes ty cannot resolve without stubs.
# invalid-assignment: _OTEL_LOGGER etc. are None-initialized then assigned OTel types
#   that ty considers incompatible with None.
[[tool.ty.overrides]]
include = ["syxx_server/app.py"]
rules = { "unresolved-attribute" = "ignore", "invalid-assignment" = "ignore" }

# --- dns_authoritative.py: socket/listener attribute access ---
# unresolved-attribute: socket operations (getattr(e, "errno", ...)) and listeners
#   module attribute access that ty cannot fully resolve through the package __init__.
[[tool.ty.overrides]]
include = ["syxx_server/dns_authoritative.py"]
rules = { "unresolved-attribute" = "ignore" }

# --- dnssec_validator.py: cryptography library type gaps ---
# not-subscriptable: _pdk() returns tuple|None; after None-guard, ty still sees the
#   union and rejects mkp[2] subscript. Inline ignore exists but ty ignores it.
# invalid-argument-type: crypto verify() calls pass bytes where ty expects different types.
# too-many-positional-arguments: resolve_authoritative() call with 4 positional + deadline
#   kwarg; ty miscounts through the re-export chain.
# call-non-callable: hashes.SHA256() etc. — ty thinks the cryptography hash class isn't callable.
# unresolved-attribute: cryptography ec/padding/serialization attribute access.
[[tool.ty.overrides]]
include = ["syxx_server/dnssec_validator.py"]
rules = { "not-subscriptable" = "ignore", "invalid-argument-type" = "ignore", "too-many-positional-arguments" = "ignore", "call-non-callable" = "ignore", "unresolved-attribute" = "ignore" }

# --- dot_listener.py: SSL context and socketserver attributes ---
# unresolved-attribute: ssl_context stored on _BoundedThreadingTCPServer (not in the
#   stdlib type stubs) and socketserver.ThreadingTCPServer internal attributes.
[[tool.ty.overrides]]
include = ["syxx_server/dot_listener.py"]
rules = { "unresolved-attribute" = "ignore" }

# --- leak.py: Ed25519 key operations on None-initialized variables + db wildcard re-exports ---
# invalid-argument-type: _COLLECTOR_PUB_KEY_RAW is None|bytes; b64encode rejects None
#   but the function returns early if key is uninitialized (ty can't narrow).
# unresolved-attribute: _COLLECTOR_PRIV_KEY.sign() — None|Ed25519PrivateKey union.
# missing-argument: db.leak_token_create() etc. are re-exported via `from .leak_repo import *`
#   in db.py; ty cannot resolve wildcard re-export signatures.
[[tool.ty.overrides]]
include = ["syxx_server/leak.py"]
rules = { "invalid-argument-type" = "ignore", "unresolved-attribute" = "ignore", "missing-argument" = "ignore" }

# --- logging_util.py: late-bound OTel logger ---
# call-non-callable: _otel_logger is initialized as None and set by app.py after OTel init.
# The error-level export path checks `if _otel_logger is not None` before calling,
# but ty sees the declared type as None and rejects the call.
[[tool.ty.overrides]]
include = ["syxx_server/logging_util.py"]
rules = { "call-non-callable" = "ignore" }

# --- netutil.py: ipaddress module attribute access ---
# unresolved-attribute: addr.packed, IPv4Address/IPv6Address attribute access that
#   ty's stubs don't fully cover for the ipaddress module.
[[tool.ty.overrides]]
include = ["syxx_server/netutil.py"]
rules = { "unresolved-attribute" = "ignore" }

# --- resolver.py: socket/SSL/struct attribute access in DNS client ---
# unresolved-attribute: socket.socket attributes, ssl.SSLContext methods, and
#   struct unpacking patterns that ty's type stubs don't fully model.
[[tool.ty.overrides]]
include = ["syxx_server/resolver.py"]
rules = { "unresolved-attribute" = "ignore" }

# --- whois_lookup.py: dict union type arithmetic and optional hostname ---
# invalid-argument-type: _bootstrap_cache["fetched_at"] is typed float|dict|None
#   (dict union value type); arithmetic on it triggers invalid-argument-type.
# Also: parsed.hostname can be None but HTTPSConnection expects str.
[[tool.ty.overrides]]
include = ["syxx_server/whois_lookup.py"]
rules = { "invalid-argument-type" = "ignore" }
