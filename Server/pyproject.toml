[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["venv", "__pycache__", ".build"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # use of assert (needed in tests)
    "S104",   # binding to all interfaces (server binds 0.0.0.0)
    "S108",   # hardcoded temp directory (test fixtures)
    "B008",   # function call in default argument (Flask-style)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S",     # security checks relaxed in tests
    "T20",   # print allowed in tests
]
"tools/*" = [
    "T20",   # CLI report scripts print their output
]

[tool.bandit]
exclude_dirs = ["tests", "venv", "__pycache__"]
skips = ["B101"]  # assert_used — needed in tests

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
