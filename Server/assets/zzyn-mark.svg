<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand gradient: cyan to violet (io-blue to io-electric) -->
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05B5D4"/>
      <stop offset="55%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#8C5CF5"/>
    </linearGradient>
    <linearGradient id="ring" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#05B5D4"/>
      <stop offset="60%" stop-color="#4A8BE0"/>
      <stop offset="100%" stop-color="#8C5CF5"/>
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC24D"/>
      <stop offset="100%" stop-color="#F59E0A"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feComponentTransfer in="b" result="bf"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode in="bf"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feComponentTransfer in="b" result="bf"><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge>
        <feMergeNode in="bf"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Inner instrument dial: hairline + tick marks (monitoring scope) -->
  <circle cx="512" cy="512" r="278" fill="none" stroke="#4A8BE0" stroke-opacity="0.42" stroke-width="4.5"/>
  <circle cx="512" cy="512" r="292" fill="none" stroke="url(#ring)" stroke-opacity="0.72"
          stroke-width="28" stroke-dasharray="5 43.66" stroke-linecap="butt"
          transform="rotate(-8 512 512)"/>

  <!-- Outer ring, broken at upper-right for the star -->
  <g filter="url(#glow)">
    <path d="M 743.9 258.1
             A 345 345 0 1 0 800.5 330.2"
          fill="none" stroke="url(#ring)" stroke-width="52" stroke-linecap="round"/>
  </g>

  <!-- Flow nodes riding the outer ring -->
  <g filter="url(#softGlow)">
    <circle cx="167" cy="512" r="15" fill="#05B5D4"/>
    <circle cx="512" cy="857" r="12" fill="#8C5CF5"/>
    <circle cx="242" cy="757" r="9"  fill="#0D9487"/>
  </g>

  <!-- Z monogram -->
  <g filter="url(#glow)">
    <path d="M 368 372 H 652 L 368 652 H 660"
          fill="none" stroke="url(#brand)" stroke-width="82"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Amber star + trailing sparkles -->
  <g filter="url(#softGlow)" transform="translate(788,270) scale(1.06)">
    <path d="M 0 -78 L 20.5 -25.5 L 76 -22 L 33 13.5 L 47 68 L 0 38 L -47 68 L -33 13.5 L -76 -22 L -20.5 -25.5 Z"
          fill="url(#star)"/>
  </g>
</svg>
