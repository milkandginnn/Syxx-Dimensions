# PROVENANCE: DERIVED-FROM-DOCUMENTATION
# NOT captured from a real host. Authored on macOS.
#
# Shape source: the file systemd-resolved installs at /run/systemd/resolve/stub-resolv.conf,
# documented in systemd-resolved(8) under "/etc/resolv.conf":
#   https://www.freedesktop.org/software/systemd/man/latest/systemd-resolved.service.html
#   "a static file ... that lists the 127.0.0.53 DNS stub ... as the only DNS server"
# On a stock Ubuntu Desktop install /etc/resolv.conf is a symlink to this file.
#
# WHAT THIS PINS — the consequence the whole seat exists to remove. When the resolvectl
# parse yielded nothing, discovery fell through to this file and adopted 127.0.0.53 as
# "the system resolver". IsUsableDNSServer filters Documentation/Unspecified/Invalid/
# Multicast/Reserved but NOT Loopback, so the stub passed every check and every
# comparison, leak and attribution probe aimed at a loopback forwarder.
#
# The honest outcome is NOT to substitute something else and NOT to treat the stub as a
# resolver: it is LinuxResolverSource.SystemdStubOnly with zero resolvers and evidence
# saying the upstream is undetermined.
nameserver 127.0.0.53
options edns0 trust-ad
search lan
