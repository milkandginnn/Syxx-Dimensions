  # 2026-08-11 /api/lookup GET — warp-hardening_20260811 pre-existing; verified against live dispatch — unchanged
  /api/lookup:
    get:
      tags: [Public]
      summary: DNS lookup via a public resolver
      parameters:
        - name: domain
          in: query
          required: true
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, default: "A", enum: ["A","AAAA","NS","CNAME","SOA","MX","TXT","CAA","PTR","SRV"] }
        - name: server
          in: query
          schema: { type: string, description: "Resolver IP (public IPs only)" }
      responses:
        "200":
          description: DNS lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DnsLookup"
        "400":
          $ref: "#/components/responses/Error400"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"

