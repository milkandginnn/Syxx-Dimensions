# Syxx four-runtime reasoning-parity CI (UBUNTU-PORT-PLAN.md WS-A3 / WS-B).
#
# The reasoning core (Syxx.Kit) ships as one IL across three .NET runtimes; the
# macOS twin (SyxxKit) is a separate Swift port. Parity is a deliverable, not a
# hope: this matrix builds + tests the shared engine on win-x64, linux-x64,
# linux-arm64 (matching the user's Ubuntu Desktop arm64 ISO) and swift-tests the
# macOS twin.
#
# PARITY GATE (Phase 7.1 QA-3): the `parity` job below used to be a NO-OP — its only
# reachable path emitted a warning annotation and `exit 0`, because the transcripts it
# diffed are produced by an emitter (WS-B2) that has never shipped. It therefore rendered
# as a passing check on every PR while measuring nothing. It now runs
# scripts/cross-platform-parity-gate.py, which asserts against source that exists TODAY
# (span names + shared wire vocabularies) and FAILS the build on divergence. The
# transcript diff remains as a second, additive assertion for when WS-B2 lands.
#
# .NET SDK: the pin lives in Windows/global.json (10.0.100 release,
# rollForward=latestMinor, no prerelease). setup-dotnet reads it directly. The
# plan's alternative is `dotnet-install.sh --channel 10.0`.
#
# NOTE (WS-A / pre-Tier-2): CA1416 stays a WARNING here, not an error. Syxx.Kit
# still has un-gated Windows-only APIs (LicenseManager DPAPI, HasConfiguredDoHTemplate,
# CageCommand SIO_RCVALL, WindowsPrincipal) that Tier 2 (WS-C/WS-D) fixes. Turning on
# <WarningsAsErrors>CA1416</WarningsAsErrors> (WS-A3) before Tier 2 lands would break
# the Linux build and this matrix. That switch is deferred to the Tier-2 completion
# commit; see the report to syxx-neural-planner.

name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# E062: SENTRY_AUTH_TOKEN must be at workflow level so step `if:` conditions can
# see it. GitHub Actions evaluates step `if:` BEFORE applying that step's own
# `env:` block, so a step-level env var is always empty when `if:` is checked.
env:
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_URL: ${{ secrets.SENTRY_URL }}

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runs-on: macos-15
            kind: swift
            transcript: transcript.macos-arm64.json
          - name: windows-x64
            runs-on: windows-latest
            kind: dotnet
            rid: win-x64
            transcript: transcript.net-win-x64.json
          - name: ubuntu-x64
            runs-on: ubuntu-latest
            kind: dotnet
            rid: linux-x64
            transcript: transcript.net-linux-x64.json
          - name: ubuntu-arm64
            runs-on: ubuntu-24.04-arm
            kind: dotnet
            rid: linux-arm64
            transcript: transcript.net-linux-arm64.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- .NET legs
      - name: Install .NET SDK (from Windows/global.json)
        if: matrix.kind == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: Windows/global.json

      # Linux builds the WinUI-free solution filter (Syxx.Kit + Syxx CLI + tests);
      # the full Windows/Syxx.sln cannot restore off Windows (SyxxUI is net10.0-windows).
      - name: Build Linux solution filter (no WinUI)
        if: matrix.kind == 'dotnet' && runner.os == 'Linux'
        run: dotnet build Windows/Syxx.Linux.slnf -c Release

      # G-04: assert the step above actually compiled the Avalonia GUI. It did not, from the
      # day the projects were added until 2026-08-04: Syxx.Linux.slnf:8-9 lists both, but
      # Windows/Syxx.sln carried no ProjectConfigurationPlatforms mapping for their GUIDs, so
      # msbuild dropped them from the build and the step still exited 0. Proven by rebuilding
      # the filter with -t:Rebuild and watching the Avalonia DLL keep its old timestamp while
      # Syxx.Kit's advanced. A green solution build is therefore not evidence the GUI compiled
      # — the output has to be looked at.
      - name: Assert the solution filter built the Avalonia GUI (G-04)
        if: matrix.kind == 'dotnet' && runner.os == 'Linux'
        run: |
          missing=0
          for dll in Linux/Ubuntu/SyxxUI.Avalonia/bin/Release/net10.0/Syxx.dll \
                     Linux/Ubuntu/SyxxUI.Avalonia.Tests/bin/Release/net10.0/SyxxUI.Avalonia.Tests.dll; do
            if [ ! -f "$dll" ]; then
              echo "::error title=G-04 regression::Syxx.Linux.slnf built green but produced no '$dll'. The solution build is skipping the Avalonia project again — check that both Avalonia GUIDs still have ProjectConfigurationPlatforms entries in Windows/Syxx.sln."
              missing=1
            fi
          done
          exit $missing

      # F043: Ubuntu witness parity tests. The three-platform witness parity harness
      # (corpus/witness-testify-parity/) defines three loaders: macOS, Windows, and Ubuntu.
      # The Ubuntu leg (SyxxUI.Avalonia.Tests) is in Syxx.Linux.slnf but was never executed
      # by CI — "three-platform parity" was asserted by two platforms. This step runs it.
      - name: Test Ubuntu witness parity (SyxxUI.Avalonia.Tests)
        if: matrix.kind == 'dotnet' && runner.os == 'Linux'
        run: dotnet test Linux/Ubuntu/SyxxUI.Avalonia.Tests/SyxxUI.Avalonia.Tests.csproj -c Release --nologo

      - name: Build reasoning core (Windows)
        if: matrix.kind == 'dotnet' && runner.os == 'Windows'
        run: dotnet build Windows/dotNET/Syxx.Kit/Syxx.Kit.csproj -c Release

      # SyxxUI (WinUI 3) has no "Any CPU" platform (see build.ps1) and cannot restore
      # off Windows, so it is built ONLY here, never via the Linux slnf. windows-latest
      # runners are x64. This is the only CI leg that ever compiles the GUI project
      # (AppViewModel.cs, WitnessView/MirrorView/etc.) — without it, a Windows GUI
      # regression (e.g. delta D091, B195) can ship verified only by static reading,
      # with no compiler ever seeing the change.
      - name: Build Windows GUI (SyxxUI, x64)
        if: matrix.kind == 'dotnet' && runner.os == 'Windows'
        run: dotnet build Windows/dotNET/SyxxUI/SyxxUI.csproj -c Release -p:Platform=x64

      # SyxxUI.Tests (D101): WinUI-3-TFM'd sibling test project referencing SyxxUI.csproj,
      # so it shares SyxxUI's windows-only/x64-only build constraints above and can only
      # run on this leg. This is the FIRST time this project has ever been compiled by
      # any CI job or agent (D101) — it was scaffolded and statically reviewed only.
      - name: Test Windows GUI witness regressions (SyxxUI.Tests, x64)
        if: matrix.kind == 'dotnet' && runner.os == 'Windows'
        run: dotnet test Windows/dotNET/SyxxUI.Tests/SyxxUI.Tests.csproj -c Release -p:Platform=x64

      - name: Test the shared reasoning core (Syxx.Tests)
        if: matrix.kind == 'dotnet'
        run: dotnet test Windows/dotNET/Syxx.Tests/Syxx.Tests.csproj -c Release --nologo

      # Real-run bar: the CLI must self-contained-publish for each Linux RID with its
      # per-RID libsodium.so. Untrimmed on purpose (NSec + DNS reflection are trim-hostile).
      - name: Verify self-contained CLI publish (${{ matrix.rid }})
        if: matrix.kind == 'dotnet' && runner.os == 'Linux'
        run: >
          dotnet publish Windows/dotNET/Syxx/Syxx.csproj -c Release
          -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true
          -o out/${{ matrix.rid }}

      # P-19 (part 1 of 2). Until now this publish produced a binary that was thrown away at the
      # end of the job: `upload-artifact` appeared exactly twice in this workflow — the parity
      # transcripts and the macOS .app — so NO Linux artifact left any run, on the platform that
      # ships first. The packaged .deb/.snap in the jobs below are part 2; this covers the bare
      # per-RID CLI, which is what anyone bisecting a Linux-only defect actually wants.
      - name: Upload the self-contained CLI (${{ matrix.rid }})
        if: matrix.kind == 'dotnet' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: syxx-cli-${{ matrix.rid }}
          path: out/${{ matrix.rid }}
          if-no-files-found: error

      # --------------------------------------------------------------- Swift leg
      - name: Test the macOS twin (SyxxKit)
        if: matrix.kind == 'swift'
        run: swift test --package-path macOS

      # C061: the fabricated preview fixture (`Conclusion.mockInconclusive`) is `#if DEBUG`-gated
      # and must be structurally absent from every release product. Failure case: remove the
      # `#if DEBUG` guard in Conclusion.swift → the symbol reappears → this step fails.
      - name: Release build + mockInconclusive symbol-absence check (C061)
        if: matrix.kind == 'swift'
        run: |
          swift build --package-path macOS -c release
          found=0
          # F044: check all three executables declared in Package.swift (syxx, syxx-gui, DeepSyxx)
          # and fail if any binary is missing — nm on a missing file would silently pass.
          for bin in macOS/.build/release/syxx macOS/.build/release/syxx-gui macOS/.build/release/DeepSyxx; do
            if [ ! -f "$bin" ]; then
              echo "::error title=C061 gate input missing::Expected release binary '$bin' not found. Product rename or layout change may have moved the build output."
              found=1
              continue
            fi
            if nm "$bin" | grep -q mockInconclusive; then
              echo "::error title=C061 regression::fabricated fixture symbol 'mockInconclusive' present in release binary $bin"
              found=1
            fi
          done
          exit $found

      # -------------------------------------------------------- SwiftLint
      # Enforces safety rules (no force unwrap, no force cast, no force try)
      # that are critical to the tri-state honesty protocol.
      - name: SwiftLint (macOS sources)
        if: matrix.kind == 'swift'
        run: |
          brew install swiftlint 2>/dev/null || true
          swiftlint lint --config .swiftlint.yml --strict

      # ----------------------------------------------- parity transcript (WS-B2)
      # ---------------------------------------------------------- Sentry symbols
      # Upload dSYMs (macOS) and PDBs (Windows) to Sentry (self-hosted) for
      # symbolicated crash reports. No-ops if SENTRY_AUTH_TOKEN is not configured.
      # SENTRY_URL points sentry-cli at the self-hosted instance.
      - name: Install sentry-cli
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
        run: |
          curl -sL https://sentry.io/get-cli/ | bash

      - name: Upload macOS dSYMs to Sentry
        if: matrix.kind == 'swift' && env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
        run: |
          sentry-cli debug-files upload \
            --org ${{ secrets.SENTRY_ORG }} \
            --project syxx-macos \
            --auth-token ${{ secrets.SENTRY_AUTH_TOKEN }} \
            macOS/.build/arm64-apple-macosx/release/

      - name: Upload Windows PDBs to Sentry
        if: matrix.kind == 'dotnet' && runner.os == 'Windows' && env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
        run: |
          sentry-cli debug-files upload \
            --org ${{ secrets.SENTRY_ORG }} \
            --project syxx-windows \
            --auth-token ${{ secrets.SENTRY_AUTH_TOKEN }} \
            Windows/dotNET/SyxxUI/bin/

      - name: Create Sentry release (server)
        if: matrix.kind == 'dotnet' && runner.os == 'Linux' && matrix.rid == 'linux-x64' && env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
        run: |
          sentry-cli releases new "syxx-server@${{ github.sha }}"
          sentry-cli releases set-commits "syxx-server@${{ github.sha }}" --auto
          sentry-cli releases finalize "syxx-server@${{ github.sha }}"

      # Phase 4.2: production-engine behavioral transcript (empty SectionInputs vector).
      - name: Emit parity transcript (${{ matrix.transcript }})
        if: matrix.kind == 'swift'
        run: |
          swift run --package-path macOS syxx parity-transcript --out=${{ matrix.transcript }}
      - name: Emit parity transcript (${{ matrix.transcript }})
        if: matrix.kind == 'dotnet'
        run: |
          dotnet run --project Windows/dotNET/Syxx/Syxx.csproj -c Release -- parity-transcript --out=${{ matrix.transcript }}
      - name: Upload parity transcript (${{ matrix.transcript }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.transcript }}
          path: ${{ matrix.transcript }}
          if-no-files-found: error

  # ---------------------------------------------------------- D096: macOS packaging
  # The macos-arm64 leg runs `swift test` and a release build but never invokes
  # bundle-app.sh, never runs codesign/notarytool/stapler/spctl, and never uploads
  # an app or DMG artifact. The .app bundle layout, Info.plist generation,
  # SMPrivilegedExecutables string, and helper embedding are NEVER exercised by
  # any automation — which is how D079's missing __launchd_plist and the identifier
  # mismatches went unnoticed. This job runs the bundler and asserts the four
  # structural checks that would have caught those defects outright.
  package-macos:
    name: macOS app bundle + structural assertions
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release (swift)
        run: swift build --package-path macOS -c release

      - name: Bundle the .app
        run: |
          chmod +x macOS/bundle-app.sh
          macOS/bundle-app.sh

      - name: Assert __launchd_plist section in helper binary
        run: |
          helper="macOS/Syxx.app/Contents/Library/LaunchServices/com.milkandgin.deepsyxx"
          if [ ! -f "$helper" ]; then
            # bundle-app.sh may place the helper elsewhere; search for it
            helper=$(find macOS/Syxx.app -name "com.milkandgin.deepsyxx" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$helper" ] || [ ! -f "$helper" ]; then
            echo "::error title=D096::helper binary not found in app bundle"
            exit 1
          fi
          if ! otool -l "$helper" | grep -q __launchd_plist; then
            echo "::error title=D096::__launchd_plist section missing from helper binary — D079 would ship again"
            exit 1
          fi
          echo "OK: __launchd_plist present in $helper"

      - name: Assert __info_plist section in helper binary
        run: |
          helper=$(find macOS/Syxx.app -name "com.milkandgin.deepsyxx" -type f 2>/dev/null | head -1)
          if ! otool -l "$helper" | grep -q __info_plist; then
            echo "::error title=D096::__info_plist section missing from helper binary"
            exit 1
          fi
          echo "OK: __info_plist present in $helper"

      # Signing and notarization are gated on the presence of the signing certificate
      # so forks and PRs still run the structural assertions unsigned.
      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Sign + verify (when certificate available)
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          codesign --verify --deep --strict macOS/Syxx.app
          spctl --assess --type exec macOS/Syxx.app || true  # spctl may reject ad-hoc on CI runners

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Syxx-macos-arm64
          path: macOS/Syxx.app
          if-no-files-found: error

  # ----------------------------------------------------------- Linux GUI lane
  # Ubuntu ships FIRST, and until now NOTHING in CI compiled the Avalonia client.
  # `Linux/Ubuntu/SyxxUI.Avalonia` appeared zero times in this workflow, and the
  # solution-filter build in build-test did not reach it either. NOT because the filter
  # excludes it — Windows/Syxx.Linux.slnf:8-9 does list both Avalonia projects. The
  # mechanism was Windows/Syxx.sln: it declared the two projects but had zero
  # ProjectConfigurationPlatforms entries for their GUIDs, so solution-level builds
  # skipped them and exited 0 (G-04, fixed 2026-08-04 — the mapping is now present and
  # the build-test job asserts the output DLLs exist). Either way this job stays: it is
  # the only lane that builds the GUI from its own csproj on a real Linux runner, and it
  # ProjectReferences the shared Syxx.Kit, so a Kit change could break the first-ship
  # platform with every other leg green. It has happened: the client stopped compiling on
  # retired DST types and nothing noticed.
  linux-gui:
    name: Ubuntu Avalonia GUI build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned from Windows/global.json, exactly like the build-test matrix legs. A floating
      # `10.0.x` here would let the first-ship platform build on a different SDK from the one
      # every other leg uses, which is how a "works in CI" divergence starts.
      - name: Set up .NET (pinned from Windows/global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: Windows/global.json

      - name: Build Avalonia client
        run: dotnet build Linux/Ubuntu/SyxxUI.Avalonia/SyxxUI.Avalonia.csproj -c Release --nologo

      - name: Test Avalonia client
        run: dotnet test Linux/Ubuntu/SyxxUI.Avalonia.Tests/SyxxUI.Avalonia.Tests.csproj -c Release --nologo

  # --------------------------------------------------------------- Server lane
  # Server security core (DNS tampering detection, Ed25519 signing, licensing)
  # has 21 test files but no CI job. This job runs pytest, the honesty-coverage
  # gate (prevents security guard deletion), and Python lint/security scans.
  server:
    name: Server pytest + honesty gate + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create venv and install dependencies
        run: |
          cd Server
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      # --- pytest: the Server suite must be green before anything else runs.
      - name: Run pytest (Server suite)
        run: |
          cd Server
          ./venv/bin/python -m pytest tests/ -q

      # --- Warp manifest corpus: regeneration drift gate. The builder is
      # idempotent (compressed bodies are kept whenever they decode to the
      # declared bytes — see warp-manifest-vectors/README.md §10), so ANY diff
      # after a regeneration is real drift: a hand-edited generated file or a
      # builder/spec change whose regenerated artifacts were not committed.
      - name: Warp manifest corpus — regeneration drift gate
        run: |
          Server/venv/bin/python warp-manifest-vectors/_build_vectors.py
          git diff --exit-code -- warp-manifest-vectors/

      # --- Honesty-coverage gate (Phase 0.4): prevents security guard deletion.
      # The gate runs the suite under coverage and asserts every registered guard
      # is exercised. A guard no test reaches can be deleted with a green suite.
      - name: Run honesty-coverage gate
        run: |
          ./scripts/honesty-coverage-gate.py

      # --- Ruff: Python lint (Phase 0.6). Tri-state backsliding has no mechanical
      # backstop without lint. Errors block merge.
      - name: Run ruff lint
        run: |
          cd Server
          ./venv/bin/ruff check syxx_server/ tests/

      # --- Bandit: Python security scanning (Phase 0.6). Catches common
      # security issues (hardcoded passwords, SQL injection, weak crypto).
      - name: Run bandit security scan
        run: |
          cd Server
          ./venv/bin/bandit -r syxx_server/ -c pyproject.toml

  # ------------------------------------------------------------- parity gate
  # Phase 7.1 QA-3. This job was previously named `diff` and was a NO-OP: the only
  # reachable path printed `::warning title=Transcript parity gate inactive` and
  # `exit 0`, because `transcripts/*.json` is always empty (the WS-B2 emitter has
  # never shipped). A check that cannot fail has never caught anything, yet showed
  # green on every PR — the exact defect class this product exists to refuse.
  #
  # It is split in two on purpose. `parity` runs against SOURCE and takes no `needs:`,
  # so it reports even when a build leg is red — the answer to "did the platforms
  # diverge?" must not be withheld because something else failed. `parity-transcript`
  # keeps the artifact dependency.
  #
  # `parity` CANNOT pass vacuously: if it finds no spans, or cannot read either source
  # tree, it fails (exit 1) or reports cannot-run (exit 2). It never exits 0 without
  # having compared something.
  parity:
    name: cross-platform parity gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- LIVE. Asserts, and fails the build on divergence:
      #   * macOS SyxxKit OTel span names == Windows Syxx.Kit ActivitySource span names
      #   * the four determinative states are present and identically spelled on both
      #   * shared wire values ("clean"/"threatDetected"/"inconclusive"/"untested",
      #     TriState, tracer outcomes, section ids, section statuses) are byte-identical
      # Matches on WIRE STRINGS, never on C#/Swift symbol names, so the in-flight
      # DeterminativeResult->DeterminativeState rename cannot break or bypass it.
      - name: Source parity gate (span names + wire vocabularies)
        run: python3 scripts/cross-platform-parity-gate.py --github

      # --- LIVE (0.3b). Fails when one NuGet package id is pinned at two versions across
      # the projects that share the reasoning core, which is how the Windows and Linux GUIs
      # end up linking different code behind identical source. Proven to fail on both known
      # instances (CommunityToolkit.Mvvm 8.3.2/8.4.2, OpenTelemetry 1.9.0/1.16.0).
      - name: NuGet pin-parity gate
        run: python3 scripts/package-pin-parity.py --github

  # Phase 4.2: behavioral transcript parity is BLOCKING. Emitters call production
  # Synthesizer.conclude / Synthesizer.Conclude on a shared empty-input vector.
  parity-transcript:
    name: transcript-diff (blocking)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download parity transcripts
        uses: actions/download-artifact@v4
        with:
          path: transcripts
          merge-multiple: true

      - name: Diff conclusion transcripts (blocking)
        run: |
          echo "Four-runtime transcript-parity diff."
          shopt -s nullglob
          found=(transcripts/transcript.*.json)
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error title=Transcript parity gate empty::No conclusion transcripts were produced. Emitters must write transcript.*.json from the production synthesizer."
            exit 1
          fi
          expected=4
          if [ ${#found[@]} -lt $expected ]; then
            echo "::error title=Transcript parity gate incomplete::Expected $expected transcripts (one per matrix leg: macos-arm64, windows-x64, ubuntu-x64, ubuntu-arm64) but found ${#found[@]}: ${found[*]}."
            exit 1
          fi
          echo "Transcripts found: ${found[*]}"
          first="${found[0]}"
          all_match=true
          for f in "${found[@]:1}"; do
            if ! diff <(jq --sort-keys . "$first") <(jq --sort-keys . "$f") > /tmp/transcript-diff.txt 2>&1; then
              echo "::error title=Transcript parity failure::$first vs $f:"
              cat /tmp/transcript-diff.txt
              all_match=false
            fi
          done
          if [ "$all_match" != true ]; then
            exit 1
          fi
          echo "All transcripts match."

  # ====================================================================== E3: Linux packaging
  # WHY THESE JOBS EXIST AT ALL (P-09..P-12, P-17..P-19)
  #   Before them, `grep -rE 'build_deb|snapcraft|dpkg' .github/` returned ZERO hits. No CI job
  #   had ever built either Linux package. That is the mechanism, not a coincidence: the .deb
  #   shipped only the GUI, the snap shipped only the CLI, both assemblies are named `Syxx` so
  #   neither omission was visible, the snap version was hardcoded, there were no maintainer
  #   scripts at all, and the licence node-lock helper was never invoked — for as long as nothing
  #   built the packages, every one of those was invisible and stayed fixed.
  #
  #   macOS already learned this. The `package-macos` job above says why it exists: the bundle
  #   layout and helper embedding "were never exercised, which is how D079's missing
  #   __launchd_plist went unnoticed." These jobs are the Linux half of that lesson.
  #
  #   A build that produces a file proves little, so `install-smoke-deb` installs the package in
  #   a clean container and asserts the properties a user depends on.
  package-deb:
    name: .deb build + payload assertions (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    steps:
      # Full history: build_deb.sh derives the package build number from
      # `git rev-list --count HEAD`. A shallow clone silently yields 1 for every build, so every
      # package would carry Version: <ver>-1 and be indistinguishable from every other.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # THE GATE THAT WAS MISSING, and the defect it exists for was live when it was written
      # (2026-08-05). build_deb.sh is committed and fails closed on
      # Linux/Ubuntu/polkit/app.syxx.policy (:209-213) and Linux/Ubuntu/debian/{postinst,postrm}
      # (:225-236) — and none of those three had ever been `git add`ed. They existed only in one
      # developer's working tree. So HEAD carried a build script that could not run on HEAD: a
      # clean checkout could not produce a .deb at all, and the failure surfaced as a bare
      # "cp: No such file or directory" eight minutes into the job, after the dotnet publishes,
      # with nothing pointing at "somebody forgot to commit three files."
      #
      # `git ls-files --error-unmatch` is the right check because it exits non-zero for every way
      # a path can fail to be in the repository — absent, untracked, or gitignored — which the
      # `test -f` guards inside build_deb.sh cannot distinguish from present-and-committed.
      # Deliberately before setup-dotnet so the diagnosis arrives first.
      - name: Assert every packaging input is committed, not just present locally
        run: |
          fail=0
          for p in Linux/Ubuntu/build_deb.sh \
                   Linux/Ubuntu/debian/postinst \
                   Linux/Ubuntu/debian/postrm \
                   Linux/Ubuntu/polkit/app.syxx.policy \
                   scripts/syxx-capture-hardware-id.sh \
                   Design/logos/syxx-logo-source.png; do
            if ! git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              echo "::error title=packaging input not committed::$p is required by Linux/Ubuntu/build_deb.sh, which fails closed without it, but git does not track it. It exists only in a working tree, so no clean checkout can build the .deb."
              fail=1
            fi
          done
          exit $fail

      - name: Set up .NET (pinned from Windows/global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: Windows/global.json

      - name: Build the .deb
        run: |
          chmod +x Linux/Ubuntu/build_deb.sh
          SYXX_DEB_ARCH=${{ matrix.arch }} Linux/Ubuntu/build_deb.sh release

      # P-09/P-17. build_deb.sh has its own fail-closed staging guard, but that guard runs on the
      # staging tree; this checks the ARCHIVE, which is the artifact a user actually receives.
      - name: Assert the archive carries BOTH programs and the new packaging files
        run: |
          deb=$(ls dist/syxx_*_${{ matrix.arch }}.deb)
          echo "Inspecting $deb"
          dpkg-deb -c "$deb" > /tmp/contents.txt
          dpkg-deb -I "$deb" > /tmp/control.txt

          fail=0
          require_path() {
            if ! grep -qE " \./${1}\$| \./${1} " /tmp/contents.txt; then
              echo "::error title=P-09/P-17 regression::the .deb does not contain /${1}. $2"
              fail=1
            fi
          }
          # The CLI. Its absence is the original defect: /usr/bin/syxx resolved to the GUI, so
          # `sudo syxx cage --duration 30` — a string the GUI itself prints — launched the GUI as
          # root with an argument it ignores.
          require_path "opt/syxx/cli/Syxx" "The CLI half of the product is missing."
          require_path "usr/bin/syxx"      "The CLI launcher is missing."
          # The GUI. Its absence would be the mirror-image defect the snap had.
          require_path "opt/syxx/gui/Syxx" "The GUI half of the product is missing."
          require_path "usr/bin/syxx-gui"  "The GUI launcher is missing."
          # P-02: the polkit action.
          require_path "usr/share/polkit-1/actions/app.syxx.policy" "No polkit action is shipped."
          # P-03: the node-lock helper must be IN the package; postinst runs where no repo exists.
          require_path "usr/lib/syxx/syxx-capture-hardware-id.sh" \
            "Without it postinst cannot node-lock and every reinstall burns an activation."

          # P-10: maintainer scripts live in the control archive, not the data archive.
          if ! grep -q "postinst" /tmp/control.txt; then
            echo "::error title=P-10 regression::the .deb declares no postinst. The hardware id is never captured."
            fail=1
          fi
          if ! grep -q "postrm" /tmp/control.txt; then
            echo "::error title=P-10 regression::the .deb declares no postrm."
            fail=1
          fi

          # P-11: the two dependencies whose absence silently degrades behaviour rather than
          # failing loudly. libsecret-tools is the load-bearing one — see the audit comment in
          # build_deb.sh — and pkexec backs both UpdateService.cs:409 and the polkit action.
          for dep in libsecret-1-0 libsecret-tools pkexec; do
            if ! grep -E '^ Depends:' /tmp/control.txt | grep -q "$dep"; then
              echo "::error title=P-11 regression::Depends: does not list '$dep'."
              fail=1
            fi
          done

          # P-12's .deb half: the version must match SyxxConfig.Version, not a typed constant.
          want=$(sed -n 's/.*public const string Version[^"]*"\([^"]*\)".*/\1/p' \
                 Windows/dotNET/Syxx.Kit/SyxxConfig.cs | head -1)
          if [ -z "$want" ]; then
            echo "::error title=version gate input missing::could not read SyxxConfig.Version"
            fail=1
          elif ! grep -E "^ Version: ${want}-" /tmp/control.txt >/dev/null; then
            echo "::error title=version drift::package Version does not start with SyxxConfig.Version ($want)."
            grep -E '^ Version:' /tmp/control.txt
            fail=1
          fi

          echo "--- control ---"; cat /tmp/control.txt
          exit $fail

      # P-19 (part 2 of 2).
      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: syxx-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------- install + smoke the package
  # The standing bar for this wave is that P-09..P-13 and P-17..P-19 become closable by CI ALONE.
  # Building an archive does not reach that bar: the archive can be well-formed and still be
  # uninstallable, or install and leave a program that cannot start. This job installs it into a
  # bare ubuntu:24.04 — deliberately NOT the runner image, which has hundreds of libraries
  # preinstalled and would mask exactly the missing-Depends class P-11 is about.
  install-smoke-deb:
    name: .deb install + smoke (${{ matrix.arch }}, ubuntu:24.04 container)
    needs: package-deb
    runs-on: ${{ matrix.runs-on }}
    container:
      image: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    steps:
      # ORDER IS LOAD-BEARING. Everything that tests the package's DEPENDS runs first, on a
      # container carrying nothing but the base image. `actions/checkout` is deliberately NOT
      # first: it needs git, and apt-installing git before the package under test would drag in
      # a pile of libraries that could satisfy a dependency the package failed to declare —
      # exactly the masking effect that makes the runner image useless for this question.
      - name: Download the .deb
        uses: actions/download-artifact@v4
        with:
          name: syxx-deb-${{ matrix.arch }}
          path: /tmp/deb

      # --no-install-recommends on purpose: Recommends must not be able to rescue a Depends the
      # package failed to declare. If apt cannot satisfy the dependency graph, it fails HERE.
      - name: Install with apt (this is the Depends test — P-11)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends /tmp/deb/*.deb

      # A failing postinst leaves dpkg in "half-configured"/"iF". "install ok installed" is
      # therefore direct evidence that DEBIAN/postinst ran and exited 0 (P-10).
      - name: Assert the maintainer script ran and the package is fully configured
        run: |
          status=$(dpkg-query -W -f='${Status}' syxx)
          echo "dpkg status: $status"
          if [ "$status" != "install ok installed" ]; then
            echo "::error title=P-10 regression::syxx is not fully configured ('$status'). DEBIAN/postinst failed."
            exit 1
          fi

      # P-09/P-17: the CLI must be the thing `syxx` resolves to. `syxx --version` prints
      # "syxx <version>" (Program.cs:94-99). The GUI has no such output — if the launcher were
      # wired to the GUI again this command would hang or print nothing, which is precisely the
      # shipped defect.
      - name: Assert `syxx` is the CLI and answers
        run: |
          out=$(timeout 60 syxx --version)
          echo "syxx --version -> $out"
          # Program.cs:94-99 prints "syxx <version>" for --version. The Avalonia GUI has no such
          # output — under the shipped defect this command opened a window or printed nothing.
          # Exact-version equality is asserted after checkout; this runs here, before any tooling
          # is installed, so it doubles as proof the CLI starts on a bare container.
          case "$out" in
            "syxx "[0-9]*) : ;;
            *)
              echo "::error title=P-09 regression::'syxx --version' printed '$out'. /usr/bin/syxx is not the CLI."
              exit 1
              ;;
          esac

      - name: Assert `syxx-gui` is installed and is a distinct program
        run: |
          test -x /usr/bin/syxx-gui || { echo "::error title=P-17 regression::/usr/bin/syxx-gui is missing"; exit 1; }
          test -x /opt/syxx/gui/Syxx || { echo "::error title=P-17 regression::/opt/syxx/gui/Syxx is missing"; exit 1; }
          test -x /opt/syxx/cli/Syxx || { echo "::error title=P-09 regression::/opt/syxx/cli/Syxx is missing"; exit 1; }

          # The two native apphosts ARE byte-identical, and that is correct, not a defect: the
          # .NET apphost is a generic launcher patched with the name of the managed assembly to
          # load, and both projects set <AssemblyName>Syxx</AssemblyName>, so both get patched
          # with "Syxx.dll" and come out to the same 78256 bytes. Verified by building the
          # package and comparing. Do NOT "fix" this by diffing the apphosts — that check fails
          # on a CORRECT package. The real product lives in the managed assembly beside them.
          if cmp -s /opt/syxx/cli/Syxx.dll /opt/syxx/gui/Syxx.dll; then
            echo "::error title=P-09/P-17 regression::/opt/syxx/cli/Syxx.dll and /opt/syxx/gui/Syxx.dll are byte-identical — one publish overwrote the other, so the package ships one program twice."
            exit 1
          fi
          # Positive identification, so this cannot pass on two copies of the wrong half.
          test -f /opt/syxx/gui/Avalonia.dll || {
            echo "::error title=P-17 regression::/opt/syxx/gui has no Avalonia.dll — that tree is not the GUI."; exit 1; }
          if [ -f /opt/syxx/cli/Avalonia.dll ]; then
            echo "::error title=P-09 regression::/opt/syxx/cli contains Avalonia.dll — the GUI was published into the CLI's directory."
            exit 1
          fi

      # P-11, precisely: every shared library the shipped native code needs must resolve using
      # ONLY the declared Depends. Deterministic, and it is the exact question "is libsecret /
      # fontconfig / libX11 in Depends?" reduced to something a machine can answer.
      - name: Assert the dynamic linker resolves every shipped native library
        run: |
          fail=0
          checked=0
          for f in /opt/syxx/cli/Syxx /opt/syxx/gui/Syxx \
                   $(find /opt/syxx -name '*.so' -o -name '*.so.*' | sort); do
            [ -f "$f" ] || continue
            checked=$((checked + 1))
            if ldd "$f" 2>/dev/null | grep -q "not found"; then
              echo "::error title=P-11 missing dependency::$f has unresolved libraries:"
              ldd "$f" | grep "not found"
              fail=1
            fi
          done
          # Cannot pass vacuously: a find that matched nothing would otherwise report success.
          if [ "$checked" -lt 3 ]; then
            echo "::error title=gate input missing::only $checked native objects were checked; the package layout changed."
            exit 1
          fi
          echo "Checked $checked native objects; all shared-library references resolved."
          exit $fail

      # ---- The Depends test is over. From here the container may gain tooling. ----
      - name: Install smoke tooling
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # xauth is named explicitly and it is not optional: xvfb-run generates an MIT-MAGIC-COOKIE
          # and pipes it to `xauth source -` before starting the server. On xvfb, xauth is a
          # Recommends, and every apt line in this job carries --no-install-recommends, so without
          # naming it the GUI step below dies on "xauth: command not found" and reports it as
          # "GUI cannot start" — a false failure pointing at the wrong file.
          # ca-certificates: the bare ubuntu:24.04 container has no CA bundle, so git's HTTPS
          # fetch of this repo fails with 'server certificate verification failed. CAfile: none'.
          # It is installed HERE, after the Depends test above has already run against the
          # untouched base image, so it cannot mask a dependency the package failed to declare.
          apt-get install -y --no-install-recommends ca-certificates git libxml2-utils xvfb xauth

      - name: Checkout (for the source-vs-shipped comparisons below)
        uses: actions/checkout@v4

      # P-12's .deb half, asserted against the running program rather than the control file.
      - name: Assert the installed CLI reports SyxxConfig.Version
        run: |
          out=$(timeout 60 syxx --version)
          want=$(sed -n 's/.*public const string Version[^"]*"\([^"]*\)".*/\1/p' \
                 Windows/dotNET/Syxx.Kit/SyxxConfig.cs | head -1)
          test -n "$want" || { echo "::error title=version gate input missing::could not read SyxxConfig.Version"; exit 1; }
          if [ "$out" != "syxx $want" ]; then
            echo "::error title=version drift::the installed CLI printed '$out', expected 'syxx $want'."
            exit 1
          fi
          echo "installed CLI reports $out"

      # P-02. The action file must land where polkitd reads it, be well-formed, and — the part
      # that actually matters — annotate a path that EXISTS. An action pointing at a renamed
      # binary matches nothing and silently falls back to the generic pkexec dialog.
      - name: Assert the polkit action landed, parses, and points at a real program
        run: |
          action=/usr/share/polkit-1/actions/app.syxx.policy
          test -f "$action" || { echo "::error title=P-02 regression::$action is missing"; exit 1; }
          xmllint --noout --nonet "$action" || { echo "::error title=P-02::$action is not well-formed XML"; exit 1; }
          # Same discipline the node-lock helper gets below: the SHIPPED action must be the
          # REVIEWED action. Every assertion after this one reads the installed file, so without
          # this line they would all pass on a build that quietly substituted a different policy —
          # and a policy is exactly the kind of file where a substituted copy is the attack.
          if ! cmp -s "$action" Linux/Ubuntu/polkit/app.syxx.policy; then
            echo "::error title=P-02::the installed polkit action differs from Linux/Ubuntu/polkit/app.syxx.policy."
            diff "$action" Linux/Ubuntu/polkit/app.syxx.policy || true
            exit 1
          fi
          path=$(sed -n 's|.*<annotate key="org.freedesktop.policykit.exec.path">\(.*\)</annotate>.*|\1|p' "$action")
          echo "exec.path -> $path"
          if [ -z "$path" ]; then
            echo "::error title=P-02::the action declares no org.freedesktop.policykit.exec.path annotation."
            exit 1
          fi
          if [ ! -x "$path" ]; then
            echo "::error title=P-02::the action annotates '$path', which is not an executable on this system."
            exit 1
          fi
          # Per-capture prompt is an owner decision (decision 2). auth_admin_keep would cache the
          # authorization for ~5 minutes and let a second capture start silently.
          # Matched inside the <allow_*> elements only: a bare `grep auth_admin_keep` also hits
          # the file's own comment explaining why it is not used, and fails on a correct policy.
          if grep -Eq '<allow_(any|inactive|active)>auth_admin_keep</' "$action"; then
            echo "::error title=P-02::the action grants auth_admin_keep; the decision is a prompt PER CAPTURE."
            exit 1
          fi
          # And the positive form: every decision arm must actually require admin auth. A file
          # that reached `yes` on any arm would authorize root with no prompt at all.
          for arm in any inactive active; do
            if ! grep -Eq "<allow_${arm}>auth_admin</allow_${arm}>" "$action"; then
              echo "::error title=P-02::allow_${arm} is not auth_admin in $action:"
              grep -E "<allow_${arm}>" "$action" || echo "  (element absent)"
              exit 1
            fi
          done

      # P-03. The container has no readable DMI UUID, so the shipped helper correctly wrote
      # nothing during postinst — which means "the file exists" is NOT an available assertion and
      # claiming it would be dishonest. What IS provable here: the helper ships at the path
      # postinst calls, it is byte-identical to the reviewed source, and it produces a correct
      # hash when given a DMI UUID.
      - name: Assert the node-lock helper ships intact and works
        run: |
          helper=/usr/lib/syxx/syxx-capture-hardware-id.sh
          test -x "$helper" || { echo "::error title=P-03 regression::$helper is missing or not executable"; exit 1; }
          if ! cmp -s "$helper" scripts/syxx-capture-hardware-id.sh; then
            echo "::error title=P-03::the packaged helper differs from scripts/syxx-capture-hardware-id.sh."
            diff "$helper" scripts/syxx-capture-hardware-id.sh || true
            exit 1
          fi
          printf '4c4c4544-0037-3210-8044-b8c04f4e4d32\n' > /tmp/fake-dmi
          SYXX_DMI_PATH=/tmp/fake-dmi "$helper" /tmp/hwid
          if ! grep -qE '^[0-9a-f]{64}$' /tmp/hwid; then
            echo "::error title=P-03::the helper did not write a SHA-256 hash:"; cat /tmp/hwid || true; exit 1
          fi
          # The all-zero placeholder must be REFUSED: every machine reporting it would otherwise
          # share one fingerprint, which is worse than having none because it looks legitimate.
          printf '00000000-0000-0000-0000-000000000000\n' > /tmp/zero-dmi
          rm -f /tmp/hwid-zero
          SYXX_DMI_PATH=/tmp/zero-dmi "$helper" /tmp/hwid-zero
          if [ -f /tmp/hwid-zero ]; then
            echo "::error title=P-03::the helper accepted the all-zero placeholder UUID."; exit 1
          fi
          echo "node-lock helper OK (real UUID hashed; placeholder refused)"

      # The one check here with real flake risk, kept fatal on purpose. It is the only automated
      # evidence that has ever existed that the shipped GUI STARTS. A bare container is harsher
      # than a real desktop (no GL, no session bus, no system fonts), so a failure here is not
      # automatically a user-facing bug — but it is always a real finding about what the package
      # declares, and the alternative is going on shipping a GUI nothing has ever launched.
      - name: Assert the GUI starts (xvfb, minimal container)
        run: |
          set +e
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            timeout 15 /usr/bin/syxx-gui > /tmp/gui.log 2>&1
          rc=$?
          set -e
          echo "--- syxx-gui output ---"; cat /tmp/gui.log || true
          # timeout kills a still-running process with 124. That is the success case: the GUI was
          # alive 15 seconds after launch. Anything else means it exited on its own.
          if [ "$rc" -ne 124 ]; then
            echo "::error title=GUI cannot start::/usr/bin/syxx-gui exited with $rc within 15s on a minimal Ubuntu carrying only the package's declared Depends. Either a Depends is missing or the GUI genuinely cannot start there."
            exit 1
          fi
          echo "GUI survived 15s under Xvfb."

  # ------------------------------------------------------------------------------- snap package
  # P-12 + P-09/P-17 for the snap. Linux/snap/snapcraft.yaml has never been built by anything;
  # it still carried a committed UNVERIFIED marker on its own stage path. This job is what turns
  # that marker into an answer. It is BLOCKING on purpose — a packaging job allowed to fail
  # quietly is indistinguishable from the zero jobs that existed before it.
  package-snap:
    name: snap build (snapcraft)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # snapcraft resolves `source: .` against the directory containing snap/snapcraft.yaml, and
      # the parts reference repo-root paths (Windows/dotNET/Syxx, Linux/Ubuntu/SyxxUI.Avalonia).
      # Copying rather than moving keeps Linux/snap/snapcraft.yaml the single source of truth.
      - name: Stage snapcraft.yaml at the project root
        run: |
          mkdir -p snap
          cp Linux/snap/snapcraft.yaml snap/snapcraft.yaml

      - name: Build the snap
        id: build
        uses: snapcore/action-build@v1

      # P-12: the snap version must now come from SyxxConfig.Version via adopt-info, not from a
      # hardcoded string under a comment asking a human to keep it in step. The filename carries
      # the adopted version, so it is checkable without unpacking.
      - name: Assert the snap version was adopted from SyxxConfig.Version
        run: |
          snapfile="${{ steps.build.outputs.snap }}"
          echo "built: $snapfile"
          want=$(sed -n 's/.*public const string Version[^"]*"\([^"]*\)".*/\1/p' \
                 Windows/dotNET/Syxx.Kit/SyxxConfig.cs | head -1)
          test -n "$want" || { echo "::error title=version gate input missing::could not read SyxxConfig.Version"; exit 1; }
          case "$(basename "$snapfile")" in
            syxx_${want}_*.snap) echo "snap version == $want" ;;
            *)
              echo "::error title=P-12 regression::snap filename '$(basename "$snapfile")' does not carry SyxxConfig.Version ($want)."
              exit 1
              ;;
          esac

      # P-09/P-17 for the snap: both programs, in separate directories. Both projects set
      # <AssemblyName>Syxx</AssemblyName>, so a single prime directory would silently keep only
      # one — which is the shape of the original defect on both packages.
      #
      # Discriminate on the MANAGED assembly, not the apphost: the two native apphosts are
      # legitimately byte-identical (a generic launcher patched with "Syxx.dll", the same string
      # for both). Confirmed by building the .deb and comparing.
      - name: Assert the snap carries BOTH programs
        run: |
          # unsquashfs comes from squashfs-tools, which reaches the runner only as a transitive
          # dependency of snapd. That is an assumption about somebody else's image, and the failure
          # mode if it ever stops holding is this job reporting a packaging regression it did not
          # observe. Naming it costs one cached apt call.
          command -v unsquashfs >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends squashfs-tools
          sudo unsquashfs -d /tmp/snapfs "${{ steps.build.outputs.snap }}" >/dev/null
          fail=0
          for p in opt/syxx/cli/Syxx opt/syxx/cli/Syxx.dll opt/syxx/gui/Syxx opt/syxx/gui/Syxx.dll; do
            if [ ! -f "/tmp/snapfs/$p" ]; then
              echo "::error title=P-09/P-17 regression::the snap does not contain $p"
              fail=1
            fi
          done
          if [ "$fail" -eq 0 ] && cmp -s /tmp/snapfs/opt/syxx/cli/Syxx.dll /tmp/snapfs/opt/syxx/gui/Syxx.dll; then
            echo "::error title=P-09/P-17 regression::the two Syxx.dll are byte-identical — one publish overwrote the other, so the snap ships one program twice."
            fail=1
          fi
          test -f /tmp/snapfs/opt/syxx/gui/Avalonia.dll || {
            echo "::error title=P-17 regression::the snap's gui tree has no Avalonia.dll — that tree is not the GUI."; fail=1; }
          if [ -f /tmp/snapfs/opt/syxx/cli/Avalonia.dll ]; then
            echo "::error title=P-09 regression::the snap's cli tree contains Avalonia.dll — the GUI was published into the CLI's directory."
            fail=1
          fi
          exit $fail

      - name: Upload the snap
        uses: actions/upload-artifact@v4
        with:
          name: syxx-snap-amd64
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  # -------------------------------------------------- real Secret Service leg (owner decision 8)
  # Every existing test of LinuxSecretStore runs on a host with no libsecret, no secret-tool and
  # no keyring, so the ONLY backend they have ever exercised is the encrypted file fallback.
  # WitnessKeyStoreLoadResultTests.cs:402 says so in as many words. That means the keyring paths
  # — the ones a real Ubuntu desktop user gets — have never been executed anywhere.
  #
  # Owner decision 8 chose route (a): stand up a real Secret Service in CI. Route (b), an interim
  # keyType presence record, was rejected because a stale record bricks the user into a permanent
  # Undetermined with no in-app recovery.
  #
  # FOR SEAT E4 — HOW TO OPT IN
  #   Job name: `linux-secret-store`. Mark any test that needs a live keyring with
  #     [Trait("Category", "SecretService")]
  #   and it runs here and nowhere else. The environment variable SYXX_CI_SECRET_SERVICE=1 is
  #   also exported, for tests that want to assert "a Secret Service is present" rather than skip.
  #   The existing WitnessKeyStoreLoadResult and MachineFingerprint classes are included by name
  #   so this leg measures something real today rather than waiting on new tests.
  linux-secret-store:
    name: LinuxSecretStore against a real GNOME Keyring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET (pinned from Windows/global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: Windows/global.json

      - name: Install a Secret Service
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsecret-1-0 libsecret-tools gnome-keyring dbus-x11

      # dbus-run-session gives the job its own session bus, which gnome-keyring-daemon needs to
      # claim org.freedesktop.secrets on. The daemon is started tolerantly; the PROBE below is
      # the strict gate, and it is what stops this leg passing vacuously. Without it, a keyring
      # that failed to start would leave the tests exercising the file fallback again and
      # reporting green — the same shape as the transcript gate this workflow already calls out.
      - name: Start the keyring, prove it answers, then run the secret-store tests
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            # A NON-EMPTY password: fed an empty string, --unlock creates no login collection and
            # secret-tool then fails with "Object does not exist at path .../collection/login"
            # (run 3). The password is throwaway CI state, not a secret.
            printf 'syxx-ci-keyring' | gnome-keyring-daemon --unlock --components=secrets --daemonize > /tmp/gk.env 2>/tmp/gk.err || true
            if [ -s /tmp/gk.env ]; then set -a; . /tmp/gk.env; set +a; fi
            sleep 2

            # STRICT: a round-trip through the real Secret Service. If this fails, the leg is
            # measuring the file fallback and must not report success.
            printf "probe-secret" | secret-tool store --label=syxx-ci-probe \
              syxx-key-type ci-probe syxx-key-id probe
            got=$(secret-tool lookup syxx-key-type ci-probe syxx-key-id probe)
            if [ "$got" != "probe-secret" ]; then
              echo "::error title=Secret Service not live::stored probe-secret, read back [$got]. This leg cannot measure the keyring paths."
              cat /tmp/gk.err || true
              exit 1
            fi
            secret-tool clear syxx-key-type ci-probe syxx-key-id probe
            echo "Secret Service round-trip OK."

            export SYXX_CI_SECRET_SERVICE=1
            dotnet test Windows/dotNET/Syxx.Tests/Syxx.Tests.csproj -c Release --nologo \
              --filter "Category=SecretService|FullyQualifiedName~WitnessKeyStoreLoadResult|FullyQualifiedName~MachineFingerprint" \
              --logger "trx;LogFileName=secret-service.trx" --results-directory /tmp/trx
          '

      # A filter that matches nothing makes this leg another check that cannot fail. Assert a
      # positive test count explicitly rather than trusting the runner exit code.
      - name: Assert the filtered run actually executed tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('/tmp/trx/**/*.trx', recursive=True)
          if not files:
              print("::error title=Secret-store leg measured nothing::no .trx was produced.")
              sys.exit(1)
          total = 0
          for f in files:
              for c in ET.parse(f).getroot().iter():
                  if c.tag.endswith('Counters'):
                      total += int(c.get('total', 0))
          print(f"executed {total} test(s) across {len(files)} trx file(s)")
          if total == 0:
              print("::error title=Secret-store leg measured nothing::the --filter matched zero tests.")
              sys.exit(1)
          PY
